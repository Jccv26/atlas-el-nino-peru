name: Horario de Perú al Día
on:
  schedule:
    - cron: '4-59/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  edicion:
    if: github.repository == 'Jccv26/atlas-el-nino-peru' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/atlas.yml
    secrets:
      ATLAS_STATE_KEY: ${{ secrets.ATLAS_STATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
