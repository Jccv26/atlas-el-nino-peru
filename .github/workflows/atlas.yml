name: Actualizar y publicar el atlas
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
  workflow_call:
    secrets:
      ATLAS_STATE_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      contrastar_rutas:
        description: Comprobar las rutas públicas de avisos hidrológicos desde el servidor
        required: false
        type: boolean
        default: false

permissions: {}
concurrency:
  group: atlas-publicacion-produccion
  cancel-in-progress: false

jobs:
  verificar-conexion-macos:
    if: inputs.contrastar_rutas == true && github.ref == 'refs/heads/main' && github.repository == 'Jccv26/atlas-el-nino-peru' && !github.event.repository.private
    runs-on: macos-15
    timeout-minutes: 3
    steps:
      - name: Comprobar los dos canales oficiales desde el segundo servidor
        shell: bash
        run: |
          for url in 'https://www.senamhi.gob.pe/?p=avisos-hidrologicos' 'https://idesep.senamhi.gob.pe/geoserver/g_dbphisis/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=g_dbphisis%3Aaviso_hidro_pub&outputFormat=application%2Fjson'; do
            curl --silent --show-error --fail --max-time 14 -o "$RUNNER_TEMP/canal" -w '%{url.host} HTTP %{http_code}\n' "$url" || continue
            python3 -c 'import json,sys; s=open(sys.argv[1]).read(); print("Avisos en capa:",len(json.loads(s)["features"])) if s.lstrip().startswith("{") else print("Índice con avisos:", "Aviso" in s and "<table" in s)' "$RUNNER_TEMP/canal"
          done
  actualizar:
    if: github.ref == 'refs/heads/main' && endsWith(github.repository, '/atlas-el-nino-peru') && !github.event.repository.fork && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Confirmar repositorio público de origen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          policy=$(gh api "repos/$GITHUB_REPOSITORY" --jq '(.fork == false and .private == false and .default_branch == "main")')
          test "$policy" = true
      - name: Leer la rama principal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 1
      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Contrastar el índice y los visores públicos de SENAMHI
        if: inputs.contrastar_rutas == true
        run: |
          diagnostico() {
            local codigo
            codigo=$(curl -sS --fail --max-time 14 --output "$RUNNER_TEMP/ruta-senamhi" --write-out '%{http_code}' "$2") || true
            echo "$1 HTTP ${codigo:-000}"
            if [[ "$codigo" == 200 ]]; then
              node -e 'const s=require("node:fs").readFileSync(process.argv[1],"utf8");try{const j=JSON.parse(s);console.log("Registros en la capa",j.features?.length??j.length??0)}catch{console.log("Contiene tabla de avisos",/<th[^>]*>Aviso</i.test(s))}' "$RUNNER_TEMP/ruta-senamhi"
            fi
          }
          diagnostico "Índice nacional de avisos" 'https://www.senamhi.gob.pe/?p=avisos-hidrologicos'
          diagnostico "Capa publicada por IDESEP" 'https://idesep.senamhi.gob.pe/geoserver/g_dbphisis/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=g_dbphisis%3Aaviso_hidro_pub&outputFormat=application%2Fjson'
          diagnostico "Consulta de avisos del visor PHISIS" 'https://www.senamhi.gob.pe/mapas/mapa-aviso-hidro/include/ajaxIdesepWFSAvisos.php'
      - name: Preparar la lectura de boletines oficiales en PDF
        run: |
          if ! command -v pdftotext >/dev/null; then
            if ! (sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update -qq &&
                  sudo apt-get -o Acquire::Retries=1 install -y --no-install-recommends poppler-utils); then
              echo "::warning::Extractor PDF temporalmente no disponible. Se conservarán las fichas oficiales y se reintentará en el siguiente ciclo."
            fi
          fi
      - name: Recuperar, contrastar y guardar la edición
        run: node scripts/estado-ci.mjs
        env:
          ATLAS_GIT_TOKEN: ${{ github.token }}
          ATLAS_STATE_KEY: ${{ secrets.ATLAS_STATE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BULLETIN_BUDGET_USD: '60'
          ATLAS_CREDIT_UNTIL: ${{ vars.ATLAS_CREDIT_UNTIL }}
      - name: Verificar los datos públicos y las referencias del boletín
        run: |
          node --test tests/*.test.mjs
          node scripts/verificar-publico.mjs
      - name: Empaquetar exclusivamente los archivos públicos
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          retention-days: 1

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publicar el atlas
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
